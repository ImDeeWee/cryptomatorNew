name: Test with Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  JAVA_DIST: zulu
  JAVA_VERSION: 22
  MAVEN_OPTS: "-XX:+UnlockDiagnosticVMOptions -XX:+BytecodeVerificationRemote"

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Compile, Test, and Generate Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build, Test, and Generate Coverage
        run: |
          export MAVEN_OPTS="$MAVEN_OPTS"
          xvfb-run mvn -B verify -Pcoverage
      - name: Get Coverage Report
        id: coverage
        run: |
          coverage=$(python3 config/coverage.py target/site/jacoco/jacoco.csv)
          echo "COVERAGE=$coverage" >> $GITHUB_ENV
      - name: Fail if coverage is below threshold
        run: |
          coverage=$COVERAGE
          threshold=13.43
          if (( $(echo "$coverage - $threshold <= 0.1" | bc -l) )); then
            echo "Coverage has not improved."
            exit 1
          else
            echo "New coverage: $coverage%"
          fi
